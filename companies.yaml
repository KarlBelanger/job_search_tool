# Company registry for the job discovery pipeline.
# ats: one of "greenhouse" | "ashby" | "workable" | "lever" | "smartrecruiters"
# slug: the identifier used in that ATS's public API URL
#
# Trimmed 2026-09-29 for the junior DevOps / Linux / cloud search
# (Baltimore, DC, Northern Virginia, US-remote). The original ~200-company
# Canadian list was checked against the new filters.yaml on that date:
# only these employers had matching US roles. Add companies you're
# targeting here; main.py also appends Greenhouse/Lever companies it
# discovers through Adzuna results (see app/discover_companies.py).

companies:
  - name: Tailscale
    ats: greenhouse
    slug: tailscale   # Customer Support Engineer (Tier 1), US-remote, on 2026-09-29
  - name: AlphaSense
    ats: greenhouse
    slug: alphasense  # Cloud Support Engineer, US-remote
  - name: Pinterest
    ats: greenhouse
    slug: pinterest   # Site Reliability Engineer II, US-remote
  - name: Jobgether
    ats: lever
    slug: jobgether   # reposts other companies' jobs; apply through Jobgether. Noisier, but most junior US listings
