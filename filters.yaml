  - "product marketing"

# Locations to keep, as regex patterns (case-insensitive) matched against
# the free-text location string each ATS/aggregator returns. Covers all of
# Maryland (Baltimore area), Washington DC, Northern Virginia, and
# US-remote. Deliberately does NOT allow a bare "Remote" with no country
# qualifier — some postings say "Remote Poland"/"Remote Spain" etc, so an
# allowlist needs an explicit country/region signal instead.
location_allow_patterns:
  # Maryland / Baltimore area
  - '\bmaryland\b'
  - ',\s*md\b'        # "Columbia, MD" / "Towson, MD"
  - '\bbaltimore\b'
  - '\bbwi\b'
  # Washington DC
  - '\bwashington,?\s*d\.?\s?c\b'
  - ',\s*d\.?c\b'
  - '\bdistrict of columbia\b'
  # Northern Virginia: named cities/counties, not all of Virginia. The
  # ambiguous names (Arlington TX, Alexandria, Vienna...) need a VA suffix.
  - '\bnorthern virginia\b'
  - '\b(fairfax|arlington|loudoun|prince william)\s+county\b'
  - '\b(reston|herndon|mclean|tysons|chantilly|ashburn|centreville|manassas|leesburg)\b'
  - '\b(arlington|alexandria|fairfax|falls church|vienna|springfield|annandale|dulles|sterling)\b,?\s*(va|virginia)\b'
  # US remote
  - '\bremote\b.*\b(us|usa|u\.s\.a?|united states)\b'
  - '\b(us|usa|u\.s\.a?|united states)\b.*\bremote\b'
  - '^\s*(us|usa|u\.s\.a?\.?|united states)\s*$'
  - '\b(north america|americas|worldwide|anywhere)\b'

# JD stack dealbreakers — if the description clearly requires one of these
# and does NOT also mention anything from stack_core, treat it as a
# mismatch. Infra JDs mention Java/.NET apps all the time, so languages
# aren't dealbreakers here; this is just legacy stacks that don't build
# toward a DevOps path. Only runs when a description is available.
stack_dealbreakers:
  - '\bmainframe\b'
  - '\bcobol\b'
  - '\bz/os\b'
  - '\bas/?400\b'
  - '\bsap basis\b'

# Your own core stack — if the JD mentions any of these, a stack dealbreaker
# match above is ignored.
stack_core:
  - '\blinux\b'
  - '\brhel\b'
  - '\bred hat\b'
  - '\bubuntu\b'
  - '\bbash\b'
  - '\bshell script'
  - '\bdocker\b'
  - '\bcontainers?\b'
  - '\bkubernetes\b'
  - '\baws\b'
  - '\bansible\b'
  - '\bterraform\b'
  - '\bgit\b'
  - '\bci/cd\b'
  - '\bjenkins\b'
  - '\bgithub actions\b'
  - '\bpython\b'
  - '\bprometheus\b'
  - '\bgrafana\b'
  - '\bwcag\b'
  - '\bscreen readers?\b'

# Security clearance: any posting whose title or description matches one
# of these is dropped. The Baltimore / DC / Fort Meade market has a lot of
# cleared roles, and this search excludes all of them, including "must be
# able to obtain" wording, since that still means going through the
# clearance process.
clearance_patterns:
  - '\bts\s*/\s*sci\b'
  - '\btop[\s-]secret\b'
  - '\bpolygraph\b'
  - '\bsecurity clearance\b'
  - '\b(active|current|secret|interim|dod|doe|government|federal)\s+(security\s+)?clearance\b'
  - '\bclearance\s+(is\s+)?required\b'
  - '\b(obtain|maintain|hold|possess)\s+(a\s+|an\s+)?(\w+\s+)?clearance\b'
  - '\bclearable\b'
  - '\bpublic trust\b'

# Accessibility certifications. A posting is dropped only when one sentence
# mentions one of these AND a required_words term, without a
# preferred_words term to soften it. "CPACC preferred" passes; "CPACC
# certification required" is dropped.
required_cert_patterns:
  - '\bcpacc\b'
  - '\bcpwa\b'
  - '\bwas\s+(certification|certified|credential)\b'
  - '\bweb accessibility specialist\b'
  - '\biaap\b'
  - '\btrusted tester\b'
  - '\baccessibility certification\b'

# Experience ceiling: a posting is dropped when one sentence asks for at
# least this many years (e.g. "5+ years of experience required") without a
# preferred_words term to soften it. Asks of 1-4 years are left alone,
# since those are often soft for junior roles.
max_required_years_experience: 5

# Wording that marks a requirement as hard vs. soft, for the certification
# and years-of-experience checks above (whole words, case-insensitive,
# matched within the same sentence). A years-of-experience sentence
# doesn't need a required_words term: "5+ years of Linux experience" on
# its own counts as a requirement.
required_words:
  - "required"
  - "requires"
  - "require"
  - "must"
  - "mandatory"
  - "minimum"
preferred_words:
  - "preferred"
  - "nice to have"
  - "a plus"
  - "plus"
  - "desired"
  - "desirable"
  - "bonus"
  - "ideally"
  - "advantage"

# Below this many characters, a JD is treated as a short aggregator teaser
# snippet rather than a full posting (see app/filters.py's looks_truncated).
truncated_description_min_chars: 400
