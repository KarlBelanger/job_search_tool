# Deterministic pre-filter rules, read by app/filters.py. Edit these lists
# directly as you refine what "in scope" means for you — no code changes
# needed. See app/filters.py's module docstring for how they're applied.
#
# Configured for a junior / entry-level DevOps, Linux and cloud
# infrastructure search in the Baltimore / DC / Northern Virginia area plus
# US-remote, with a narrow accessibility-testing track alongside it.
#
# All title keyword lists are matched as whole words/phrases,
# case-insensitive (so "noc" can't match inside "innocent", and "sr" can't
# match inside "misread").

# Unambiguous target-role title signals. If the title matches one of these,
# it's kept regardless of exclusion_keywords below — but NOT regardless of
# seniority_exclude_keywords, which always applies. Keep this list short
# and genuinely unambiguous.
priority_title_keywords:
  - "devops"
  - "dev ops"
  - "site reliability"
  - "sre"
  - "linux"
  - "sysadmin"
  - "system administrator"
  - "systems administrator"
  - "unix administrator"
  - "cloud engineer"
  - "cloud support"
  - "cloud operations"
  - "cloud administrator"
  - "platform engineer"
  - "noc"
  - "network operations"
  # Accessibility track — deliberately narrow: hands-on accessibility
  # testing/engineering titles only.
  - "accessibility engineer"
  - "accessibility analyst"
  - "accessibility specialist"
  - "accessibility tester"
  - "accessibility test engineer"
  - "accessibility qa"
  - "digital accessibility"
  - "web accessibility"
  - "section 508"
  - "a11y"

# Title must match priority_title_keywords or one of these to be
# considered at all. These are broader, so exclusion_keywords still apply.
title_allow_keywords:
  - "infrastructure"
  - "systems engineer"
  - "system engineer"
  - "operations engineer"
  - "it operations"
  - "production support"
  - "application support"
  - "technical support engineer"
  - "support engineer"
  - "cloud"
  - "build engineer"
  - "release engineer"
  - "automation engineer"
  - "monitoring"
  - "observability"
  - "network administrator"
  - "network engineer"
  - "server administrator"

# Always dropped, even for priority_title_keywords matches: this search is
# for junior / entry-level roles. Unlabeled titles and "I" / "II" /
# "junior" / "associate" / "entry level" all pass; the AI score judges the
# rest.
seniority_exclude_keywords:
  - "senior"
  - "sr"
  - "sr."
  - "staff"
  - "principal"
  - "lead"
  - "manager"
  - "director"
  - "head of"
  - "architect"
  - "vp"
  - "vice president"
  - "chief"
  - "expert"
  - "iii"
  - "iv"

# Even if the title matched title_allow_keywords, drop it if it also
# matches one of these — adjacent titles that aren't a fit.
exclusion_keywords:
  - "accountant"
  - "accounting"
  - "nurse"
  - "nursing"
  - "lawyer"
  - "attorney"
  - "paralegal"
  - "chemist"
  - "chemistry"
  - "electrician"
  - "plumber"
  - "welder"
  - "sales representative"
  - "account executive"
  - "sales engineer"
  - "sales development"
  - "business development representative"
  - "solutions engineer"
  - "pre-sales"
  - "presales"
  - "recruiter"
  - "talent acquisition"
  - "talent brand"
  - "warehouse"
  - "forklift"
  - "driver"
  - "cdl"
  - "teacher"
  - "professor"
  - "dentist"
  - "physician"
  - "pharmacist"
  - "mechanical engineer"
  - "electrical engineer"
  - "civil"
  - "structural"
  - "chemical engineer"
  - "industrial engineer"
  - "manufacturing engineer"
  - "hardware engineer"
  - "process engineer"
  - "field engineer"
